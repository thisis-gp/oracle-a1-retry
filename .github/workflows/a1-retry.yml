name: A1 retry

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  actions: write   # to disable this workflow once we succeed
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config + key
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_KEY }}" > ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=ocid1.user.oc1..aaaaaaaaqe3ih3v5w7u6lkczadyz6fn6qmlwxc6jgqc2nitbifftb67shqaa
          fingerprint=fe:71:f6:93:80:e2:3d:87:07:11:39:1c:99:24:6d:2f
          tenancy=ocid1.tenancy.oc1..aaaaaaaao3mc7np5v3hzyqxzaewfmglopndkmchuko6gphhdevqv25es7dma
          region=ap-hyderabad-1
          key_file=/home/runner/.oci/key.pem
          EOF
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Attempt launch
        run: bash launch_a1_once.sh

      - name: Notify + stop on success
        if: ${{ hashFiles('success.marker') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="✅ Oracle A1 backend-vm-a1 launched in ap-hyderabad-1. Check the OCI console." >/dev/null || true
          fi
          # Stop retrying now that we have it.
          gh workflow disable "${{ github.workflow }}" || true
